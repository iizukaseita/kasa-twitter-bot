name: Daily Kumosuke Tweet

on:
  schedule:
    # 毎朝7:00 JST = 22:00 UTC (前日)
    - cron: '0 22 * * *'
  workflow_dispatch: # 手動実行も可能

permissions: {}

jobs:
  tweet:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # actions/checkout@v4 (resolved 2026-10-20 UTC)

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # actions/setup-python@v5 (resolved 2026-10-20 UTC)
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements.txt'

      - name: Post daily tweet
        working-directory: src
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python tweet.py
